<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232648e9'/%3E%3Cpath d='M8 22l5-7 4 4 7-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nexora Analytics — turn business data into better decisions. Revenue, sales, customers and performance analytics in one dashboard." />
    <title>Nexora Analytics — Business Analytics SaaS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply saved theme, accent palette and depth mode before paint to avoid flashes.
      try {
        var t = localStorage.getItem("nexora-theme");
        if (t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
        var a = localStorage.getItem("nexora-accent");
        var accents = ["indigo", "violet", "emerald", "rose", "amber", "ocean"];
        document.documentElement.dataset.accent = accents.indexOf(a) >= 0 ? a : "indigo";
        document.documentElement.dataset.depth = localStorage.getItem("nexora-depth") === "off" ? "off" : "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
